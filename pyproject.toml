[project]
name = "diffprivlab"
version = "0.1.0"
description = "Verified Differential Privacy Engine with Composition Theorem Harness"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "ruff", "bandit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diffprivlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "UP"]
ignore = ["E501", "UP006", "UP045"]
